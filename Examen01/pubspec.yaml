name: cinetrack
description: CineTrack - App de seguimiento de películas y series con persistencia dual.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # SQL - Relacional
  sqflite: ^2.3.2
  path: ^1.9.0
  # NoSQL - No Relacional
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Estado
  provider: ^6.1.2
  # UI
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  # Utilidades
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
